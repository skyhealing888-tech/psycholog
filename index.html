<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Psychologist</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#222;--muted:#777;--accent:#5b7cfa;--border:#e3e1dc}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#222;--text:#eee;--muted:#999;--accent:#7d97ff;--border:#333}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 12px 8px;display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto}
header h1{font-size:17px;margin:0}
.langs{display:flex;gap:4px}
.langs button{padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--muted);font-size:12px;font-weight:600}
.langs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav{display:flex;gap:4px;padding:0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;padding:10px 4px;border:none;background:none;color:var(--muted);font-size:14px;border-bottom:2px solid transparent}
nav button.active{color:var(--accent);border-color:var(--accent)}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:15px}
.cardHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cardHead h3{margin:0}
.reminder{border:2px solid var(--accent)}
.remText{white-space:pre-wrap;font-size:16px;line-height:1.5}
.remEmpty{color:var(--muted);font-style:italic;font-size:14px}
.link{background:none;border:none;color:var(--accent);font-size:14px;padding:4px}
textarea,input[type=text]{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
textarea{min-height:110px;resize:vertical}
.btn{padding:10px 14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px}
.btn.sec{background:var(--border);color:var(--text)}
.btn.rec{background:#e5484d}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.emos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.emo{padding:10px 4px;border-radius:10px;border:3px solid transparent;color:#fff;font-size:14px;font-weight:600}
.emo.sel{border-color:var(--text)}
.emo.peek{outline:2px dashed var(--text);outline-offset:2px}
#emoDesc{font-size:13px;color:var(--muted);min-height:18px;margin-top:8px}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
input[type=range]{width:100%}
.meta{font-size:12px;color:var(--muted)}
.sum{margin:6px 0;font-size:14px}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;color:#fff;font-size:12px;margin:2px}
.hidden{display:none!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
<h1 data-i="title"></h1>
<div class="langs"><button data-lang="ru">RU</button><button data-lang="de">DE</button><button data-lang="en">EN</button></div>
</header>
<nav>
<button class="active" data-tab="write" data-i="tabWrite"></button>
<button data-tab="history" data-i="tabHistory"></button>
<button data-tab="patterns" data-i="tabPatterns"></button>
<button data-tab="data" data-i="tabData"></button>
</nav>
<main>
<section id="write">
<div class="card reminder">
<div class="cardHead"><h3 data-i="remTitle"></h3><button class="link" id="remEdit" data-i="edit"></button></div>
<div id="remView" class="remText"></div>
<div id="remForm" class="hidden">
<textarea id="remInput" data-ph="remPh"></textarea>
<div class="row"><button class="btn" id="remSave" data-i="saveRem"></button><button class="btn sec" id="remCancel" data-i="cancel"></button></div>
</div>
</div>
<div class="card">
<h3 data-i="whatHappens"></h3>
<textarea id="text" data-ph="textPh"></textarea>
<div class="row"><button class="btn sec" id="mic"></button></div>
</div>
<div class="card">
<h3 data-i="emotions"></h3>
<div class="emos" id="emos"></div>
<div id="emoDesc"></div>
</div>
<div class="card">
<h3 data-i="thoughtRecord"></h3>
<label data-i="situation"></label><input type="text" id="sit">
<label data-i="autoThought"></label><input type="text" id="thought">
<label><span data-i="before"></span>: <b id="bv">5</b></label><input type="range" id="before" min="0" max="10" value="5">
<label data-i="alt"></label><input type="text" id="alt">
<label><span data-i="after"></span>: <b id="av">5</b></label><input type="range" id="after" min="0" max="10" value="5">
</div>
<button class="btn" id="save" style="width:100%" data-i="save"></button>
</section>
<section id="history" class="hidden"><div id="histList"></div></section>
<section id="patterns" class="hidden">
<p class="meta" id="chartsNote"></p>
<div class="card"><h3 data-i="freq"></h3><canvas id="c1"></canvas></div>
<div class="card"><h3 data-i="intensity"></h3><canvas id="c2"></canvas></div>
</section>
<section id="data" class="hidden">
<div class="card">
<h3 data-i="export"></h3>
<p class="meta" data-i="exportNote"></p>
<div class="row"><button class="btn" id="exp" data-i="download"></button><button class="btn sec" id="cp" data-i="copy"></button></div>
</div>
<div class="card">
<h3 data-i="import"></h3>
<p class="meta" data-i="importNote"></p>
<input type="file" id="imp" accept=".json,application/json">
</div>
</section>
</main>
<div class="toast" id="toast"></div>
